<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#004d44">
<title>Lurati · Estación del Asesor</title>
<style>
:root{
  --green:#004d44;--green2:#0e352c;--teal:#128f8b;--paper:#f7faf9;
  --line:#d7e3e0;--ink:#23332f;--muted:#5e716c;--red:#b42318;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#station{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
#newLeadBtn{
  position:fixed;right:18px;bottom:18px;z-index:1000;border:0;border-radius:999px;
  background:var(--green);color:#fff;font-weight:800;font-size:15px;padding:14px 20px;
  box-shadow:0 8px 28px rgba(0,77,68,.28);cursor:pointer
}
#newLeadBtn:hover{background:var(--green2)}
.overlay{
  display:none;position:fixed;inset:0;z-index:2000;background:rgba(14,53,44,.52);
  padding:18px;overflow:auto
}
.overlay.open{display:block}
.modal{
  max-width:650px;margin:18px auto;background:#fff;border-radius:22px;padding:20px;
  box-shadow:0 20px 70px rgba(0,0,0,.24)
}
.head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.head .logo{width:42px;height:42px;border-radius:12px;background:var(--green);color:#fff;
 display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px}
.head h1{font-size:22px;color:var(--green2);margin:0}
.head p{font-size:13px;color:var(--muted);margin:3px 0 0}
.close{margin-left:auto;border:0;background:#eef4f2;color:var(--green);width:36px;height:36px;border-radius:10px;font-size:19px;cursor:pointer}
.section{margin:15px 0}
.label{font-size:12px;font-weight:800;color:#475467;margin-bottom:7px}
.sellers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seller{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px;text-align:left;cursor:pointer}
.seller strong{display:block;font-size:14px;color:var(--ink)}
.seller small{display:block;color:#98a2b3;margin-top:2px}
.seller.on{background:var(--green);border-color:var(--green)}
.seller.on strong,.seller.on small{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.chip{border:0;border-radius:999px;padding:7px 10px;background:#e8f1ef;color:var(--green);font-weight:800;font-size:12px;cursor:pointer}
input,textarea{
 width:100%;border:1px solid #d0d5dd;border-radius:13px;padding:0 13px;
 font-size:17px;outline:none;background:#fff;color:var(--ink);font-family:inherit
}
input{height:50px}
textarea{min-height:76px;padding-top:12px;resize:vertical;line-height:1.35}
input:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(18,143,139,.10)}
.action{
 width:100%;min-height:54px;border:0;border-radius:14px;background:var(--green);color:#fff;
 font-size:16px;font-weight:900;cursor:pointer;margin-top:5px
}
.action:disabled{opacity:.55}
.status{display:none;margin-top:13px;border-radius:14px;padding:13px;font-size:14px;line-height:1.45}
.status.show{display:block}
.ok{background:#e8f5ef;color:#175f49}.warn{background:#fff6e5;color:#795700}.err{background:#fee4e2;color:#b42318}
.dupBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.miniBtn{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-weight:800;cursor:pointer}
.miniBtn.continue{background:var(--green);color:#fff;border-color:var(--green)}
.footerActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.footerActions a,.footerActions button{flex:1;min-width:145px;text-align:center;border-radius:10px;padding:10px;border:1px solid var(--line);background:#fff;color:var(--green);font-weight:800;text-decoration:none;cursor:pointer}
.queuePanel{display:none;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.queuePanel.show{display:block}
.queueHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.queueHead strong{font-size:13px;color:var(--ink)}
.queueHead span{font-size:12px;color:var(--muted)}
.queueList{display:grid;gap:7px}
.queueItem{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.queueDot{width:9px;height:9px;border-radius:50%;background:#98a2b3}
.queueItem.waiting .queueDot,.queueItem.sending .queueDot,.queueItem.checking .queueDot{background:#ef9f27}
.queueItem.saved .queueDot{background:#1d9e75}
.queueItem.error .queueDot{background:var(--red)}
.queueInfo{min-width:0}
.queueInfo b{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queueInfo small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.retryBtn{border:1px solid var(--line);background:#fff;color:var(--green);font-weight:800;border-radius:8px;padding:6px 8px;cursor:pointer}
@media(max-width:520px){
  .overlay{padding:0}
  .modal{min-height:100%;margin:0;border-radius:0;padding:18px 14px 28px}
  .sellers{grid-template-columns:1fr 1fr}
  #newLeadBtn{right:12px;padding:12px 16px}
}
/* v44 · Mantener libre la navegación inferior, incluido el área segura del iPhone. */
[hidden]{display:none!important}
body.lead-modal-open #newLeadBtn{display:none}
.overlay{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@supports(height:100dvh){.overlay{height:100dvh}.modal{min-height:0}}
@media(max-width:680px){
 #newLeadBtn{bottom:calc(var(--lead-nav-height,72px) + 12px + env(safe-area-inset-bottom,0px))}
 .modal{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<iframe id="station" src="./estacion-base.html" title="Estación del Asesor"></iframe>
<button id="newLeadBtn" type="button" hidden>+ Cargar lead</button>


<div id="overlay" class="overlay">
  <div class="modal">
    <div class="head">
      <div class="logo">L</div>
      <div>
        <h1>Nueva consulta</h1>
        <p>Se registra directamente en el CRM Lurati y avisa al vendedor. Sin salir de la Estación.</p>
      </div>
      <button id="close" class="close" type="button">×</button>
    </div>


    <div class="section">
      <div class="label">1. Vendedor</div>
      <div id="sellers" class="sellers"><small>Cargando vendedores…</small></div>
    </div>


    <div class="section">
      <div class="label">2. Últimos inmuebles usados</div>
      <div id="chips" class="chips"></div>
      <div class="label">Buscar en el resto de propiedades</div>
      <input id="property" list="propertyList" placeholder="Ej. Rodríguez 1671" autocomplete="off">
      <datalist id="propertyList"></datalist>
    </div>


    <div class="section">
      <div class="label">Nombre</div>
      <input id="name" placeholder="Nombre del cliente" autocomplete="name">
    </div>


    <div class="section">
      <div class="label">Teléfono</div>
      <input id="phone" type="tel" inputmode="tel" placeholder="341..." autocomplete="tel">
    </div>


    <div class="section">
      <div class="label">Observaciones</div>
      <textarea id="obs" placeholder="Ej. Quiere visitar esta semana, paga contado, consulta por inversión, viene de Instagram, etc."></textarea>
    </div>


    <button id="save" class="action" type="button">REGISTRAR Y DERIVAR</button>
    <div id="status" class="status"></div>
    <div id="queuePanel" class="queuePanel">
      <div class="queueHead"><strong>Cargas recientes</strong><span id="queueSummary"></span></div>
      <div id="queueList" class="queueList"></div>
    </div>
  </div>
</div>


<script>
const frame=document.getElementById('station');
const overlay=document.getElementById('overlay');
const sellersBox=document.getElementById('sellers');
const property=document.getElementById('property');
const propertyList=document.getElementById('propertyList');
const nameInput=document.getElementById('name');
const phone=document.getElementById('phone');
const obsInput=document.getElementById('obs');
const status=document.getElementById('status');
const save=document.getElementById('save');
const queuePanel=document.getElementById('queuePanel');
const queueList=document.getElementById('queueList');
const queueSummary=document.getElementById('queueSummary');
let selectedSeller='';
let apiUrl='';
let configLoaded=false;
let pendingData=null;
let queueProcessing=false,queueEpoch=0,queueTimer=0,submitting=false,draftActor='';
const queueControllers=new Set();
const DRAFT_KEY='lurati_lead_draft_v44_';
let configAt=0,configJob=null;
const QUEUE_KEY='lurati_v16_lead_queue';
let queueReadFault=false;
let leadQueue=loadLeadQueue();


const FALLBACK_ACTIVE_SELLERS = [
  "Stefano","Julio","Pablo","Flavia","Ariel","Roberto","Virginia","Pedro","Maximiliano","Daiana","Tomás Debailleux","Belén Lopez","Cintia"
];


function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function digits(s){return String(s||'').replace(/\D/g,'');}
function titleAddress(s){
  const lower=new Set(['de','del','la','las','los','y','e']);
  return String(s||'').trim().replace(/\s+/g,' ').split(' ').map((p,i)=>{
    if(/^\d/.test(p))return p;
    const x=p.toLowerCase();
    if(i>0&&lower.has(x))return x;
    return x.charAt(0).toUpperCase()+x.slice(1);
  }).join(' ');
}
function stationApi(){
  if(apiUrl)return apiUrl;
  try{
    apiUrl=frame.contentWindow.eval("typeof SHEET_URL!=='undefined'?SHEET_URL:''")||'';
  }catch(e){}
  return apiUrl;
}


// v33 · La carga rápida usa la sesión ya validada de la Estación.
function stationSession(){try{return frame.contentWindow.LuratiAuth?.session()||null;}catch(_){return null;}}
const PIN33_FRAME_FETCH=window.fetch.bind(window);
window.fetch=async function(input,options){
  const url=new URL(typeof input==='string'?input:input.url,location.href),api=stationApi();
  if(!api)return PIN33_FRAME_FETCH(input,options);const target=new URL(api);
  if(url.origin!==target.origin||url.pathname!==target.pathname)return PIN33_FRAME_FETCH(input,options);
  const s=stationSession();if(!s)throw new Error('Ingresá con tu PIN personal en la Estación.');
  const opts={...(options||{}),referrerPolicy:'no-referrer'};
  if(String(opts.method||'GET').toUpperCase()==='POST'){const d=JSON.parse(opts.body);d.token=s.token;opts.body=JSON.stringify(d);}else url.searchParams.set('token',s.token);
  const response=await PIN33_FRAME_FETCH(url.toString(),opts);
  if(String(opts.method||'GET').toUpperCase()==='GET'){
   try{const data=await response.clone().json();if(data.code==='AUTH_REQUIRED')frame.contentWindow.LuratiAuth?.invalidate?.(s.token,data.error);}catch(_){}
  }
  return response;
};
let pin33LastActor='';
function syncLeadSession(){
 const s=stationSession(),actor=s?.nombre||'',btn=document.getElementById('newLeadBtn');
 if(btn)btn.hidden=!s;
 if(actor===pin33LastActor)return;
 if(draftActor)saveLeadDraft();
 pauseLeadQueue();
 pin33LastActor=actor;draftActor=actor;
 property.value=nameInput.value=phone.value=obsInput.value='';selectedSeller='';
 if(!s)closeModal();else{restoreLeadDraft();loadConfig();processLeadQueue();}
 renderLeadQueue();positionLeadButton();
}
setInterval(syncLeadSession,700);
function currentAdvisor44(){return stationSession()?.nombre||'';}
function positionLeadButton(){
 try{
  const nav=frame.contentDocument.querySelector('.mobile-bar');
  const height=nav&&frame.contentWindow.getComputedStyle(nav).display!=='none'?nav.getBoundingClientRect().height:0;
  if(height)document.documentElement.style.setProperty('--lead-nav-height',Math.ceil(height)+'px');
 }catch(_){}
}
function draftData(){return {vendedor:selectedSeller,propiedad:property.value,nombre:nameInput.value,telefono:phone.value,observaciones:obsInput.value};}
function saveLeadDraft(){
 if(!draftActor)return true;
 try{localStorage.setItem(DRAFT_KEY+draftActor,JSON.stringify(draftData()));return true;}
 catch(_){return false;}
}
function restoreLeadDraft(){
 if(!draftActor)return;
 try{
  const d=JSON.parse(localStorage.getItem(DRAFT_KEY+draftActor)||'null');if(!d)return;
  selectedSeller=String(d.vendedor||'');property.value=String(d.propiedad||'');
  nameInput.value=String(d.nombre||'');phone.value=String(d.telefono||'');obsInput.value=String(d.observaciones||'');
 }catch(_){}
}
for(const el of [property,nameInput,phone,obsInput])el.addEventListener('input',saveLeadDraft);


function currentAdvisor(){
  try{
    return frame.contentWindow.eval("typeof current!=='undefined'?current:''")||'';
  }catch(e){return '';}
}
function recentProps(){
  try{return JSON.parse(localStorage.getItem('lurati_v15_recent_props')||'[]')}catch(e){return[]}
}
function rememberProp(v){
  v=titleAddress(v); if(!v)return;
  let a=recentProps().filter(x=>x!==v);
  a=[v,...a].slice(0,3);
  try{localStorage.setItem('lurati_v15_recent_props',JSON.stringify(a));}catch(_){}
  renderChips();
}
function renderChips(){
  const a=recentProps();
  document.getElementById('chips').innerHTML=a.length
    ? a.map(x=>`<button class="chip" type="button" data-v="${esc(x)}">${esc(x)}</button>`).join('')
    : '<small style="color:#98a2b3">Todavía no hay inmuebles recientes.</small>';
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{property.value=b.dataset.v;saveLeadDraft();nameInput.focus();});
}
function setStatus(type,html){
  status.className='status show '+type;
  status.innerHTML=html;
}
function requestId(){
  try{return 'L-'+crypto.randomUUID();}
  catch(e){return 'L-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);}
}
function loadLeadQueue(){
 try{
  const a=JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]');
  if(!Array.isArray(a))throw new Error('Formato de cola inválido.');
  return a.filter(x=>x&&x.requestId).map(x=>{
   if(['sending','checking'].includes(x.status)){x.status='waiting';x.sentAt=x.sentAt||x.createdAt||Date.now();}
   if(x.status==='error'&&x.createdBy&&!x.definitive){x.status='waiting';x.sentAt=x.sentAt||x.createdAt||Date.now();}
   if(!x.createdBy){x.status='error';x.error='Carga anterior al PIN: Stefano debe revisar antes de reintentar.';}
   x.nextAt=0;return x;
  });
 }catch(_){queueReadFault=true;return [];}
}
function persistLeadQueue(){
 if(queueReadFault)return false;
 // Nunca recortar cargas pendientes, aunque haya más de veinte.
 const recent=new Set(leadQueue.filter(x=>['saved','cancelled'].includes(x.status)).slice(-30).map(x=>x.requestId));
 const keep=leadQueue.filter(x=>!['saved','cancelled'].includes(x.status)||recent.has(x.requestId));
 try{localStorage.setItem(QUEUE_KEY,JSON.stringify(keep));leadQueue=keep;return true;}
 catch(_){return false;}
}
function queueLabel(item){
 if(item.status==='saved')return 'Guardado'+(item.crmId?' como '+item.crmId:'');
 if(item.status==='cancelled')return 'No se cargó: consulta duplicada.';
 if(item.status==='duplicate')return 'Ya existe una consulta similar. Elegí cómo continuar.';
 if(item.status==='checking'||item.status==='sending')return 'Confirmando en el CRM…';
 if(item.status==='error')return item.error||'Revisar esta carga.';
 if(navigator.onLine===false)return 'Conservado en este dispositivo. Se retomará con conexión.';
 if(document.hidden)return 'Carga pendiente. Se retomará al volver.';
 return item.error||'Conservado en este dispositivo. Pendiente de confirmación.';
}
function renderLeadQueue(){
 const actor=currentAdvisor44(),own=leadQueue.filter(x=>x.createdBy===actor||!x.createdBy&&actor==='Stefano');
 const visible=own.filter(x=>!['saved','cancelled'].includes(x.status)).concat(own.filter(x=>['saved','cancelled'].includes(x.status)).slice(-6)).reverse();
 queuePanel.classList.toggle('show',visible.length>0);
 const pending=own.filter(x=>['waiting','sending','checking'].includes(x.status)).length;
 queueSummary.textContent='Pendientes: '+pending+' · A revisar: '+own.filter(x=>['error','duplicate'].includes(x.status)).length;
 queueList.innerHTML=visible.map(item=>`
  <div class="queueItem ${esc(item.status==='duplicate'?'error':item.status)}">
   <span class="queueDot"></span><div class="queueInfo"><b>${esc(item.nombre)} · ${esc(item.propiedad)}</b><small>${esc(queueLabel(item))}</small></div>
   ${['error','waiting'].includes(item.status)?`<button class="retryBtn" type="button" data-retry="${esc(item.requestId)}">Reintentar</button>`:''}
   ${item.status==='duplicate'?`<div><button class="retryBtn" data-allow="${esc(item.requestId)}">Cargar igual</button><button class="retryBtn" data-cancel="${esc(item.requestId)}">No duplicar</button></div>`:''}
  </div>`).join('');
 queueList.querySelectorAll('[data-retry],[data-allow],[data-cancel]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.retry||b.dataset.allow||b.dataset.cancel,item=leadQueue.find(x=>x.requestId===id);
  if(!item||!actor||item.createdBy&&item.createdBy!==actor)return;
  if(!item.createdBy){if(actor!=='Stefano')return;item.createdBy=actor;}
  if(b.dataset.cancel)item.status='cancelled';
  else{if(b.dataset.allow)item.duplicateChecked=true;item.status='waiting';item.nextAt=0;item.error='';item.definitive=false;}
  if(!persistLeadQueue())setStatus('err','No se pudo conservar el cambio en este dispositivo.');
  renderLeadQueue();processLeadQueue();
 });
 document.getElementById('newLeadBtn').textContent=pending?'+ Cargar lead ('+pending+')':'+ Cargar lead';
}


function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function fetchJsonTimeout(url,ms){
 const controller=new AbortController();queueControllers.add(controller);
 const timer=setTimeout(()=>controller.abort(),ms);
 try{
  const r=await fetch(url,{signal:controller.signal,cache:'no-store'});
  if(!r.ok)throw new Error('El CRM no respondió correctamente.');
  const data=await r.json();
  if(data?.code==='AUTH_REQUIRED'){const e=new Error(data.error||'Ingresá con tu PIN.');e.code='AUTH_REQUIRED';throw e;}
  return data;
 }finally{clearTimeout(timer);queueControllers.delete(controller);}
}


function openModal(){
  if(!stationSession())return;
  overlay.classList.add('open');document.body.classList.add('lead-modal-open');
  status.className='status';
  renderChips();
  renderLeadQueue();
  loadConfig();
  if(innerWidth>680)setTimeout(()=>property.focus(),80);
}
function closeModal(){
  saveLeadDraft();overlay.classList.remove('open');document.body.classList.remove('lead-modal-open');
}
document.getElementById('newLeadBtn').onclick=openModal;
document.getElementById('close').onclick=closeModal;
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});


function cachedSellers(){
  try{
    const x=JSON.parse(localStorage.getItem('lurati_v15_active_sellers')||'null');
    if(!x || !Array.isArray(x.items) || !x.items.length) return [];
    return x.items;
  }catch(e){return [];}
}


function saveSellersCache(items){
  try{
    localStorage.setItem('lurati_v15_active_sellers',JSON.stringify({
      ts:Date.now(),
      items:(items||[])
    }));
  }catch(e){}
}


function sellersFromStation(){
  const cache=cachedSellers();
  if(cache.length) return cache;


  return FALLBACK_ACTIVE_SELLERS.map((nombre,i)=>({
    nombre,
    email:'',
    whatsapp:'',
    orden:i+1
  }));
}


function cachedProps(){
  try{
    const x=JSON.parse(localStorage.getItem('lurati_v15_props_cache')||'null');
    if(!x || !Array.isArray(x.items)) return [];
    return x.items;
  }catch(e){return [];}
}


function savePropsCache(items){
  try{
    localStorage.setItem('lurati_v15_props_cache',JSON.stringify({
      ts:Date.now(),
      items:(items||[]).slice(0,700)
    }));
  }catch(e){}
}


function renderPropertyOptions(props){
  propertyList.innerHTML=(props||[])
    .map(p=>`<option value="${esc(titleAddress(p.dir||p.nombre||''))}"></option>`)
    .join('');
}


async function refreshSellersBackground(){
  const api=stationApi();
  if(!api)return;
  try{
    const cr=await fetch(api+'?q=redesConfig').then(r=>r.json());
    const sellers=(cr&&cr.config&&cr.config.vendedores)||[];
    if(sellers.length){
      renderSellers(sellers);
      saveSellersCache(sellers);
    }
  }catch(e){}
}


async function refreshPropsBackground(){
  const api=stationApi();
  if(!api)return;
  try{
    const pr=await fetch(api+'?q=propiedades').then(r=>r.json());
    const props=(pr&&pr.propiedades)||[];
    if(props.length){
      renderPropertyOptions(props);
      savePropsCache(props);
    }
  }catch(e){}
}


function loadConfig(){
 if(!configLoaded){
  renderSellers(sellersFromStation());const cp=cachedProps();if(cp.length)renderPropertyOptions(cp);configLoaded=true;
 }
 if(!stationSession()||configJob||Date.now()-configAt<120000)return configJob;
 configAt=Date.now();
 configJob=Promise.allSettled([refreshSellersBackground(),refreshPropsBackground()]).finally(()=>{configJob=null;});
 return configJob;
}


function renderSellers(sellers){
  sellersBox.innerHTML=sellers.map(v=>`
    <button type="button" class="seller ${v.nombre===selectedSeller?'on':''}" data-v="${esc(v.nombre)}">
      <strong>${esc(v.nombre)}</strong>
      <small>${v.email?'Aviso Gmail activo':'Gmail sin configurar'}</small>
    </button>`).join('');
  sellersBox.querySelectorAll('.seller').forEach(b=>{
    b.onclick=()=>{
      selectedSeller=b.dataset.v;saveLeadDraft();
      sellersBox.querySelectorAll('.seller').forEach(x=>x.classList.toggle('on',x===b));
    };
  });
}
async function checkDuplicate(data){
  const api=stationApi();
  if(!api)return null;
  try{
    const j=await fetchJsonTimeout(
      api+'?q=duplicado&tel='+encodeURIComponent(data.telefono)+'&prop='+encodeURIComponent(data.propiedad),
      4500
    );
    return j&&j.duplicado?j.duplicado:null;
  }catch(e){return null;}
}
function duplicateMessage(d){
  if(!d)return '';
  const when=d.dias==null?'':(d.dias===0?'Consultó hoy.':`Consultó hace ${d.dias} día${d.dias===1?'':'s'}.`);
  return `Ya figura ${esc(d.id||'')} por este inmueble, asignado a <b>${esc(d.vendedor||'sin vendedor')}</b>. ${esc(when)}`;
}
function queueReady(actor,epoch){
 return epoch===queueEpoch&&!document.hidden&&navigator.onLine!==false&&stationSession()?.nombre===actor;
}
function pauseLeadQueue(){
 queueEpoch++;queueProcessing=false;clearTimeout(queueTimer);
 queueControllers.forEach(c=>c.abort());
 for(const item of leadQueue)if(['sending','checking'].includes(item.status)){item.status='waiting';item.nextAt=0;}
 persistLeadQueue();renderLeadQueue();
}
function scheduleLeadQueue(){
 clearTimeout(queueTimer);
 if(document.hidden||navigator.onLine===false||!stationSession())return;
 const times=leadQueue.filter(x=>x.createdBy===currentAdvisor44()&&x.status==='waiting').map(x=>x.nextAt||0);
 if(times.length)queueTimer=setTimeout(processLeadQueue,Math.max(250,Math.min(30000,Math.min(...times)-Date.now())));
}
async function readLeadReceipt(item){
 const api=stationApi();if(!api)throw new Error('Esperando conexión con el CRM.');
 return fetchJsonTimeout(api+'?q=estadoCarga&requestId='+encodeURIComponent(item.requestId)+'&_='+Date.now(),6500);
}
function applyLeadReceipt(item,result){
 if(result?.estado==='error'){
  const error=new Error(result.error||'El CRM rechazó esta carga.');error.definitive=true;throw error;
 }
 if(result?.estado!=='guardado')return false;
 item.status='saved';item.error='';item.crmId=result.id||'';item.savedAt=Date.now();item.vendedorFinal=result.vendedor||item.vendedor;
 persistLeadQueue();renderLeadQueue();
 if(currentAdvisor44()===item.vendedorFinal){try{frame.contentWindow.eval("LEADS=null; loadLeads();");}catch(_){}}
 return true;
}
function postLead(item){
 const api=stationApi();if(!api)throw new Error('Esperando conexión con el CRM.');
 if(item.createdBy!==stationSession()?.nombre)throw new Error('Ingresá con el perfil que creó esta carga.');
 // La respuesta opaca del POST no prueba que se guardó. La confirmación es estadoCarga.
 return fetch(api,{
  method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},
  body:JSON.stringify({accion:'nuevoLead',requestId:item.requestId,vendedor:item.vendedor,propiedad:item.propiedad,
   nombre:item.nombre,telefono:item.telefono,observaciones:item.observaciones||'',cargadoPor:item.createdBy,canal:'WhatsApp'})
 });
}
async function processLeadQueue(){
 if(queueProcessing||document.hidden||navigator.onLine===false||!stationSession())return;
 const actor=currentAdvisor44(),epoch=queueEpoch;
 queueProcessing=true;clearTimeout(queueTimer);
 try{
  while(queueReady(actor,epoch)){
   const item=leadQueue.find(x=>x.createdBy===actor&&x.status==='waiting'&&(x.nextAt||0)<=Date.now());
   if(!item)break;
   item.status='checking';item.error='';persistLeadQueue();renderLeadQueue();
   try{
    // Las cargas interrumpidas se verifican antes de volver a enviarse, con el mismo ID.
    if(item.sentAt){
     const receipt=await readLeadReceipt(item);if(!queueReady(actor,epoch))return;
     if(applyLeadReceipt(item,receipt))continue;
    }
    if(!item.sentAt&&!item.duplicateChecked){
     const duplicate=await checkDuplicate(item);if(!queueReady(actor,epoch))return;
     if(duplicate){item.status='duplicate';item.duplicate=duplicate;persistLeadQueue();renderLeadQueue();continue;}
     item.duplicateChecked=true;
    }
    if(!queueReady(actor,epoch))return;
    item.sentAt=Date.now();item.attempts=(item.attempts||0)+1;
    if(!persistLeadQueue())throw new Error('No se puede conservar esta carga en el dispositivo.');
    // No esperar la ejecución completa de Apps Script ni el envío del correo.
    postLead(item).catch(()=>{});
    for(let i=0;i<5;i++){
     await wait(i?1300:450);if(!queueReady(actor,epoch))return;
     const receipt=await readLeadReceipt(item);if(!queueReady(actor,epoch))return;
     if(applyLeadReceipt(item,receipt))break;
    }
    if(item.status!=='saved')throw new Error('Pendiente de confirmación. Se verificará de nuevo automáticamente.');
   }catch(e){
    if(!queueReady(actor,epoch))return;
    item.status=e.definitive||e.code==='AUTH_REQUIRED'?'error':'waiting';
    item.definitive=!!e.definitive;item.error=String(e.message||e);
    item.nextAt=Date.now()+Math.min(60000,5000*Math.max(1,item.attempts||1));
    persistLeadQueue();renderLeadQueue();
   }
  }
 }finally{if(epoch===queueEpoch){queueProcessing=false;scheduleLeadQueue();}}
}
function enqueueLead(data){
 const actor=currentAdvisor44();
 if(!actor)return setStatus('err','Ingresá con tu PIN antes de cargar una consulta.');
 const item={requestId:requestId(),createdBy:actor,...data,status:'waiting',createdAt:Date.now(),attempts:0,error:'',nextAt:0};
 leadQueue.push(item);
 if(!persistLeadQueue()){
  leadQueue=leadQueue.filter(x=>x!==item);
  setStatus('err','No se pudo conservar la consulta en este dispositivo. Tus datos siguen en el formulario. Revisá el espacio o el permiso de almacenamiento antes de reintentar.');
  return false;
 }
 rememberProp(data.propiedad);
 nameInput.value='';phone.value='';obsInput.value='';saveLeadDraft();
 setStatus('warn','<b>Consulta conservada en este dispositivo.</b><br>'+esc(data.nombre)+' · '+esc(data.propiedad)+'<br>La confirmación del CRM aparece en Cargas recientes. Podés cargar otra consulta.');
 renderLeadQueue();processLeadQueue();return true;
}
function submit(){
 if(submitting)return;submitting=true;save.disabled=true;
 try{
  const data={vendedor:selectedSeller,propiedad:titleAddress(property.value),nombre:String(nameInput.value||'').trim(),
   telefono:String(phone.value||'').trim(),observaciones:String(obsInput.value||'').trim()};
  if(!stationSession())return setStatus('err','Ingresá con tu PIN antes de cargar una consulta.');
  if(!data.vendedor)return setStatus('err','Elegí el vendedor.');
  if(!data.propiedad)return setStatus('err','Elegí o escribí el inmueble.');
  if(!data.nombre)return setStatus('err','Falta el nombre.');
  if(digits(data.telefono).length<7)return setStatus('err','Revisá el teléfono.');
  saveLeadDraft();enqueueLead(data);
 }finally{submitting=false;save.disabled=false;}
}


save.onclick=()=>submit(false);
renderLeadQueue();
setTimeout(processLeadQueue,250);
function resumeLeadWork(){
 if(document.hidden)return;
 syncLeadSession();positionLeadButton();processLeadQueue();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveLeadDraft();pauseLeadQueue();}else resumeLeadWork();});
window.addEventListener('pagehide',()=>{saveLeadDraft();pauseLeadQueue();});
window.addEventListener('pageshow',resumeLeadWork);
window.addEventListener('online',resumeLeadWork);
window.addEventListener('offline',pauseLeadQueue);
window.addEventListener('resize',positionLeadButton);


// v34: el contacto se registra sólo al confirmarlo desde la Estación.
frame.addEventListener('load',()=>{
  setTimeout(()=>{syncLeadSession();positionLeadButton();loadConfig();},120); // precarga antes de que Flavia toque el botón
  if(new URLSearchParams(location.search).get('modo')==='redes'){
    setTimeout(openModal,280);
  }
});
